[build]
  command = "node build.mjs"
  publish = "dist"

[[headers]]
  for = "/kb.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/faq.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
